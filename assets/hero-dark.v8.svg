<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Eddy Vargas — Neavus 23</title>
<desc id="desc">Dark signature hero using a Linux prompt, signal traces and an abstract systems map.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b10"/><stop offset=".55" stop-color="#0b1017"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ee787"/><stop offset=".52" stop-color="#58a6ff"/><stop offset="1" stop-color="#d2a8ff"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#58a6ff" stop-opacity=".16"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
  <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 7.5H8" stroke="#ffffff" stroke-opacity=".018"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<rect width="1200" height="420" rx="24" fill="url(#scan)"/>
<rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#30363d"/>
<circle cx="952" cy="210" r="230" fill="url(#halo)"/>

<!-- signature strip -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="54" y="44" font-size="12" font-weight="700" fill="#7ee787">NEAVUS / 23</text>
  <text x="1146" y="44" text-anchor="end" font-size="11" fill="#6e7681">signal://trace/live</text>
  <path d="M54 58H1146" stroke="#21262d"/>
  <text x="54" y="91" font-size="14" fill="#7ee787">neavus@workstation:~$ ./trace --signal</text>
  <text x="54" y="113" font-size="12" fill="#6e7681">signal acquired · noise suppressed</text>
</g>

<!-- identity -->
<g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <text x="54" y="190" font-size="58" font-weight="850" letter-spacing="1.8" fill="#f0f6fc">EDDY VARGAS</text>
  <text x="56" y="229" font-size="20" font-weight="650" fill="#c9d1d9">follow the signal. remove the noise.</text>
  <text x="56" y="264" font-size="15" fill="#8b949e">architecture · automation · systems · problem solving</text>
</g>

<!-- signature quote -->
<g transform="translate(54 301)">
  <rect width="545" height="52" rx="12" fill="#0f151d" stroke="#252d37"/>
  <rect width="4" height="52" rx="2" fill="url(#signal)"/>
  <text x="22" y="22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6e7681">// operating principle</text>
  <text x="22" y="40" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#c9d1d9">Systems should explain themselves when they fail.</text>
</g>

<!-- abstract signal map -->
<g transform="translate(728 86)">
  <circle cx="198" cy="142" r="128" fill="#0a1118" stroke="#21262d"/>
  <circle cx="198" cy="142" r="92" fill="none" stroke="#21262d" stroke-dasharray="3 8"/>
  <circle cx="198" cy="142" r="54" fill="none" stroke="#30363d"/>
  <path d="M48 154 C82 154 78 102 111 102 S141 182 174 182 S204 122 237 122 S267 164 300 164 S322 110 347 110" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
  <path d="M56 198 C95 198 96 174 130 174 S159 218 194 218 S229 187 262 187 S298 210 335 210" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 7"/>
  <g fill="#0d1117" stroke-width="2">
    <circle cx="111" cy="102" r="7" stroke="#7ee787"/>
    <circle cx="174" cy="182" r="7" stroke="#58a6ff"/>
    <circle cx="237" cy="122" r="7" stroke="#d2a8ff"/>
    <circle cx="300" cy="164" r="7" stroke="#7ee787"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">
    <text x="88" y="84">observe</text>
    <text x="148" y="205">connect</text>
    <text x="217" y="104">decide</text>
    <text x="281" y="188">verify</text>
  </g>
  <g transform="translate(166 111)">
    <path d="M32 0 60 16v32L32 64 4 48V16z" fill="#101923" stroke="url(#signal)" stroke-width="2.2"/>
    <text x="32" y="31" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="800" fill="#f0f6fc">23</text>
    <text x="32" y="46" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="7.5" fill="#8b949e">NEAVUS</text>
  </g>
</g>

<!-- tiny signal markers -->
<g opacity=".7" filter="url(#blur)"><circle cx="1050" cy="94" r="7" fill="#7ee787"/><circle cx="1120" cy="246" r="8" fill="#58a6ff"/><circle cx="880" cy="344" r="7" fill="#d2a8ff"/></g>

<!-- footer terminal status -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="54" y="389" font-size="12" fill="#7ee787">status:</text>
  <text x="108" y="389" font-size="12" fill="#8b949e">curious / building / verifying</text>
  <rect x="318" y="378" width="7" height="14" rx="1" fill="#7ee787"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  <text x="1146" y="389" text-anchor="end" font-size="11" fill="#6e7681">signal &gt; noise</text>
</g>
</svg>