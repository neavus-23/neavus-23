<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Eddy Vargas — Cybersecurity Specialist</title>
  <desc id="desc">Dark Linux terminal-inspired hero banner focused on identity and tone, not a summary of the full profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d12"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#30363d" stroke-opacity="0.17"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#30363d"/>
  <circle cx="955" cy="205" r="210" fill="url(#glow)"/>

  <rect x="38" y="34" width="1124" height="352" rx="18" fill="#0b1118" stroke="#30363d"/>
  <rect x="38" y="34" width="1124" height="42" rx="18" fill="#10161f"/>
  <rect x="38" y="58" width="1124" height="18" fill="#10161f"/>
  <rect x="39" y="35" width="1122" height="40" rx="17" fill="none" stroke="#1f2731"/>

  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <rect x="58" y="49" width="14" height="14" rx="3" fill="#7ee787"/>
    <path d="M61.5 56h7" stroke="#0d1117" stroke-width="1.4" stroke-linecap="round"/>
    <text x="82" y="60" font-size="12.5" fill="#c9d1d9">tmux / bash / eddy@workstation</text>
    <text x="1137" y="60" text-anchor="end" font-size="11" fill="#8b949e">public-safe profile</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="74" y="116" font-size="15" fill="#7ee787">eddy@workstation:~$ ./whoami --brief</text>
  </g>

  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="74" y="180" font-size="52" font-weight="800" letter-spacing="1.6" fill="#f0f6fc">EDDY VARGAS</text>
    <text x="74" y="214" font-size="17" font-weight="700" letter-spacing="1.8" fill="#58a6ff">CYBERSECURITY SPECIALIST</text>
    <text x="74" y="254" font-size="20" fill="#c9d1d9">Controls-first thinking for real-world risk.</text>
    <text x="74" y="287" font-size="15" fill="#8b949e">Security engineering, architecture and problem solving — with just enough code.</text>
  </g>

  <g transform="translate(74 317)" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <rect width="182" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <circle cx="18" cy="15" r="4" fill="#7ee787"/>
    <text x="30" y="20" font-size="12" fill="#c9d1d9">security engineering</text>

    <rect x="194" width="132" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <circle cx="212" cy="15" r="4" fill="#58a6ff"/>
    <text x="224" y="20" font-size="12" fill="#c9d1d9">controls first</text>

    <rect x="338" width="145" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <circle cx="356" cy="15" r="4" fill="#d2a8ff"/>
    <text x="368" y="20" font-size="12" fill="#c9d1d9">problem solving</text>
  </g>

  <g transform="translate(760 102)">
    <rect x="0" y="0" width="340" height="200" rx="14" fill="#0f141b" stroke="#30363d"/>
    <rect x="0" y="0" width="340" height="28" rx="14" fill="#131a24"/>
    <rect x="0" y="14" width="340" height="14" fill="#131a24"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
      <text x="16" y="18" font-size="10.5" fill="#8b949e">session: hero</text>
      <text x="16" y="52" font-size="12.5" fill="#7ee787">$ riskctl status</text>
      <text x="16" y="76" font-size="12" fill="#c9d1d9">context   <tspan fill="#7ee787">[ok]</tspan></text>
      <text x="16" y="98" font-size="12" fill="#c9d1d9">controls  <tspan fill="#7ee787">[loaded]</tspan></text>
      <text x="16" y="120" font-size="12" fill="#c9d1d9">evidence  <tspan fill="#58a6ff">[enabled]</tspan></text>
      <text x="16" y="142" font-size="12" fill="#c9d1d9">noise     <tspan fill="#d2a8ff">[filtered]</tspan></text>
      <text x="16" y="174" font-size="12.5" fill="#7ee787">$ _</text>
    </g>
    <rect x="16" y="188" width="308" height="2" rx="1" fill="url(#accent)" opacity="0.85"/>
  </g>

  <g opacity="0.65" filter="url(#soft)">
    <circle cx="1075" cy="130" r="6" fill="#7ee787"/>
    <circle cx="1110" cy="210" r="5" fill="#58a6ff"/>
    <circle cx="1030" cy="280" r="5" fill="#d2a8ff"/>
  </g>
  <g stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <path d="M1035 142h38"/>
    <path d="M1062 220h54"/>
    <path d="M988 288h60"/>
  </g>

  <rect x="74" y="364" width="574" height="2" rx="1" fill="url(#accent)" opacity="0.9"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="74" y="350" font-size="13.5" fill="#7ee787">status:</text>
    <text x="131" y="350" font-size="13.5" fill="#8b949e">understand → design → control → verify</text>
    <rect x="425" y="338" width="8" height="15" rx="1" fill="#7ee787">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>