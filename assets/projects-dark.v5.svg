<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-label="Things I could not leave alone"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ee787"/><stop offset=".55" stop-color="#58a6ff"/><stop offset="1" stop-color="#d2a8ff"/></linearGradient></defs><rect width="1100" height="280" rx="18" fill="#0d1117"/><rect x=".5" y=".5" width="1099" height="279" rx="17.5" fill="none" stroke="#30363d"/><g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><text x="32" y="38" font-size="13" font-weight="800" fill="#7ee787" letter-spacing="1.2">NEAVUS / BUILDS</text><text x="32" y="64" font-size="23" font-weight="800" fill="#f0f6fc">Things I couldn't leave alone</text><text x="1068" y="41" text-anchor="end" font-size="11" fill="#8b949e">personal builds · employer context omitted</text><g transform="translate(32 86)"><rect width="328" height="158" rx="14" fill="#10151c" stroke="#30363d"/><rect width="4" height="158" rx="2" fill="#7ee787"/><text x="22" y="30" font-size="17" font-weight="800" fill="#f0f6fc">Marvaris Guardian</text><text x="22" y="51" font-size="10.5" font-weight="800" fill="#7ee787" letter-spacing=".8">AI RUNTIME GOVERNANCE / OBSERVABILITY</text><text x="22" y="82" font-size="12" fill="#c9d1d9">Watching prompts, agents and decisions</text><text x="22" y="100" font-size="12" fill="#c9d1d9">at runtime — with evidence when things get weird.</text><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10"><rect x="22" y="122" width="64" height="22" rx="11" fill="#17211b" stroke="#2f5137"/><text x="54" y="137" text-anchor="middle" fill="#7ee787">Python</text><rect x="94" y="122" width="72" height="22" rx="11" fill="#141c25" stroke="#29445d"/><text x="130" y="137" text-anchor="middle" fill="#58a6ff">FastAPI</text><rect x="174" y="122" width="82" height="22" rx="11" fill="#17151f" stroke="#46395e"/><text x="215" y="137" text-ancho